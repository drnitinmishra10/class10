<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 Chemistry - Chapter 1 (Set 2)</title>
    <style>
        :root {
            --primary-color: #00b4db;
            --secondary-color: #0083b0;
            --correct-bg: #e8f5e9;
            --correct-text: #1b5e20;
            --correct-border: #a5d6a7;
            --wrong-bg: #ffebee;
            --wrong-text: #b71c1c;
            --wrong-border: #ef9a9a;
            --warn-bg: #fffde7;
            --warn-text: #f57f17;
            --warn-border: #fff59d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .instructions {
            background: linear-gradient(to right, #eef2f3, #e4e8f0);
            border-left: 5px solid var(--secondary-color);
            padding: 15px;
            margin-bottom: 35px;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #1a202c;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }

        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            background: #f8fafc;
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            user-select: none;
            min-width: 100px;
            justify-content: center;
        }

        .option-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
            accent-color: var(--secondary-color);
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct-feedback {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .wrong-feedback {
            background-color: var(--wrong-bg);
            color: var(--wrong-text);
            border: 1px solid var(--wrong-border);
        }

        .warn-feedback {
            background-color: var(--warn-bg);
            color: var(--warn-text);
            border: 1px solid var(--warn-border);
        }

        .btn-container {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 131, 176, 0.4);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 131, 176, 0.6);
        }

        #result-card {
            display: none;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chemical Reactions & Equations</h1>
    <div class="subtitle">Class 10 CBSE Chemistry — Chapter 1 Deep Dive (Set 2)</div>
    
    <div class="instructions">
        🎯 <strong>Self-Assessment Mode:</strong> Ready for a tougher round? Go through these 25 deeper conceptual challenges. Submit at any moment to evaluate your response or study the rationales.
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>

        <div class="btn-container">
            <button type="button" class="submit-btn" onclick="checkQuiz()">Check My Answers</button>
        </div>
    </form>

    <div id="result-card"></div>
</div>

<script>
    const quizData = [
        { q: "Magnesium ribbon is rubbed with sandpaper before burning to remove a protective layer of basic magnesium carbonate.", a: "true", e: "Magnesium reacts with moist air to form a stable layer of basic magnesium carbonate [MgCO₃·Mg(OH)₂] on its surface, which prevents smooth burning." },
        { q: "When potassium iodide solution is added to lead nitrate solution, a yellow precipitate of potassium nitrate is formed.", a: "false", e: "The yellow precipitate formed is Lead Iodide (PbI₂). Potassium nitrate remains in the solution as a colorless salt." },
        { q: "The evolution of a gas or a change in temperature can indicate that a chemical reaction has taken place.", a: "true", e: "Gas evolution, temperature variations, color alterations, state transformations, and precipitation are classic indicators of a chemical change." },
        { q: "In the reaction: CuO + H₂ → Cu + H₂O, Hydrogen acts as the oxidizing agent.", a: "false", e: "Hydrogen removes oxygen from CuO, so it is reducing the other substance. Hence, Hydrogen is the reducing agent; Copper oxide is the oxidizing agent." },
        { q: "A balanced skeletal equation is also called a molecular equation.", a: "false", e: "A skeletal chemical equation is an *unbalanced* chemical equation that simply shows chemical formulas of reactants and products without correct coefficients." },
        { q: "When white silver bromide is exposed to sunlight, it decomposes into grey silver and bromine gas.", a: "true", e: "This photolytic decomposition reaction (2AgBr → 2Ag + Br₂) forms the historic foundation of black and white photography." },
        { q: "When carbon dioxide gas is passed through lime water, it turns milky due to the formation of soluble calcium bicarbonate.", a: "false", e: "It turns milky due to the formation of *insoluble* Calcium Carbonate (CaCO₃). It becomes clear later if excess CO₂ forms soluble calcium bicarbonate." },
        { q: "All exothermic reactions require initial heating to start, but they release net energy overall.", a: "true", e: "Most exothermic processes require an initial activation energy input (like striking a matchstick) before they self-sustainably release heat." },
        { q: "The reaction of heating ferrous sulfate crystals causes a color change from green to white, and then to brown.", a: "true", e: "Green crystals lose water of crystallization to turn white (anhydrous FeSO₄), and then decompose into brown ferric oxide (Fe₂O₃) gas." },
        { q: "During the electrolysis of acidified water, oxygen gas is evolved at the cathode.", a: "false", e: "Oxygen is an electronegative ion and migrates to the positive electrode, which is the Anode. Hydrogen gas evolves at the Cathode." },
        { q: "When zinc reacts with copper sulfate, the blue color of the solution fades away and a red-brown deposit is observed.", a: "true", e: "Zinc is more reactive and displaces copper to form colorless Zinc Sulfate (ZnSO₄), dropping metallic copper out as a reddish deposit." },
        { q: "The reaction between sodium sulfate and barium chloride is an endothermic reaction.", a: "false", e: "It is a double displacement precipitation reaction that takes place at room temperature without requiring heat absorption." },
        { q: "Nitrogen gas is filled in oil food packets because it acts as an antioxidant.", a: "true", e: "Nitrogen creates an unreactive, inert atmosphere that effectively isolates fats and oils from incoming oxygen molecules." },
        { q: "The rusting of iron is a faster process in distilled water than in seawater.", a: "false", e: "Seawater contains salts (electrolytes) that accelerate the electrochemical breakdown of iron, making it rust significantly faster." },
        { q: "When sulfur powder is burned in air, a gas with the smell of burning sulfur (choking smell) is evolved.", a: "true", e: "S + O₂ → SO₂. Sulfur dioxide gas possesses a highly pungent, suffocating smell of burning sulfur." },
        { q: "Corrosion damages objects made of iron only, while other metals remain completely unaffected by air and moisture.", a: "false", e: "Other metals corrode too; copper turns green and silver tarnishes to black due to environmental interaction." },
        { q: "In a balanced chemical equation, the total number of atoms of each element remains conserved.", a: "true", e: "This directly honors the Law of Conservation of Mass, establishing balanced ratios on both reactant and product sides." },
        { q: "The reaction: CH₄ + 2O₂ → CO₂ + 2H₂O is a combustion reaction and is highly endothermic.", a: "false", e: "Combustion reactions burn fuel in oxygen to produce a massive amount of heat and light, making them strictly exothermic." },
        { q: "When quicklime is added to water, a loud popping sound is heard.", a: "false", e: "No popping sound is heard. It produces a distinct hissing sound due to the vigorous, highly exothermic generation of steam." },
        { q: "When lead nitrate crystals are heated in a boiling tube, a crackling sound is produced.", a: "true", e: "Lead nitrate undergoes thermal cracking and decomposition, producing characteristic decrepitation (crackling) noises." },
        { q: "Reduction is defined as the addition of oxygen or removal of hydrogen.", a: "false", e: "Reduction is explicitly defined as the *removal* of oxygen or the *addition* of hydrogen (or gain of electrons)." },
        { q: "When iron nails are dipped in copper sulfate solution, the nails turn brownish in color.", a: "true", e: "Iron displaces copper from the solution, causing a thin layer of elemental red-brown copper metal to coat the iron nail surface." },
        { q: "The chemical equation: H₂ + Cl₂ → 2HCl represents a combination reaction.", a: "true", e: "Two separate elemental gaseous reactants fuse together directly to give a single product (Hydrogen Chloride)." },
        { q: "An insoluble solid product that separates instantly during a chemical transformation is called a distillate.", a: "false", e: "It is called a precipitate. A distillate is a liquid collected via condensation during distillation." },
        { q: "Placing iron structures in contact with a more reactive metal like zinc to prevent rusting is called sacrificial protection.", a: "true", e: "Zinc easily oxidizes instead of the iron, sacrificing itself to shield the structural iron frame from ambient oxygen." }
    ];

    function loadQuestions() {
        const container = document.getElementById('questionsContainer');
        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-text">Q${index + 1}. ${item.q}</div>
                <div class="options">
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="true"> True
                    </label>
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="false"> False
                    </label>
                </div>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            container.appendChild(card);
        });
    }

    function checkQuiz() {
        let correctCount = 0;
        let attemptedCount = 0;

        quizData.forEach((item, index) => {
            const selectedRadio = document.querySelector(`input[name="q${index}"]:checked`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            feedbackDiv.style.display = 'block';
            
            if (!selectedRadio) {
                feedbackDiv.className = 'feedback warn-feedback';
                feedbackDiv.innerHTML = `⚠️ <b>Not Attempted.</b> The correct answer is <b>${item.a.toUpperCase()}</b>.<br>${item.e}`;
            } else {
                attemptedCount++;
                const selectedValue = selectedRadio.value;
                
                if (selectedValue === item.a) {
                    correctCount++;
                    feedbackDiv.className = 'feedback correct-feedback';
                    feedbackDiv.innerHTML = `🎉 <strong>Correct!</strong> ${item.e}`;
                } else {
                    feedbackDiv.className = 'feedback wrong-feedback';
                    feedbackDiv.innerHTML = `❌ <strong>Incorrect.</strong> The correct answer is <b>${item.a.toUpperCase()}</b>.<br>${item.e}`;
                }
            }
        });

        const resultCard = document.getElementById('result-card');
        resultCard.style.display = 'block';
        
        let percentage = attemptedCount > 0 ? Math.round((correctCount / quizData.length) * 100) : 0;
        
        resultCard.innerHTML = `
            Score: ${correctCount} / ${quizData.length} Correct (${percentage}%) <br>
            <span style="font-size: 1rem; font-weight: normal; opacity: 0.9;">
                You attempted ${attemptedCount} out of ${quizData.length} questions.
            </span>
        `;
        
        if (correctCount >= 20) {
            resultCard.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
            resultCard.style.color = '#fff';
        } else if (correctCount >= 12) {
            resultCard.style.background = 'linear-gradient(135deg, #f12711 0%, #f5af19 100%)';
            resultCard.style.color = '#fff';
        } else {
            resultCard.style.background = 'linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)';
            resultCard.style.color = '#fff';
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    window.onload = loadQuestions;
</script>

</body>
</html>
