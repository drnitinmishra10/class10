<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CBSE Class 10 MCQ – Life Processes & Reflection of Light</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0eff8; min-height: 100vh; padding: 1rem; color: #1a1a1a; }

  .header { background: linear-gradient(135deg, #534AB7 0%, #7B72D9 100%); border-radius: 16px; padding: 1.25rem 1.25rem 1rem; margin-bottom: 1.25rem; max-width: 680px; margin-left: auto; margin-right: auto; }
  .header h1 { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .header p { font-size: 13px; color: rgba(255,255,255,0.8); }
  .header-stats { display: flex; gap: 12px; margin-top: 0.75rem; }
  .hstat { background: rgba(255,255,255,0.15); border-radius: 8px; padding: 5px 12px; font-size: 12px; color: #fff; font-weight: 500; }

  .section-label { max-width: 680px; margin: 0 auto 0.6rem; font-size: 12px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #534AB7; padding-left: 2px; }

  .q-card { background: #fff; border-radius: 14px; border: 1.5px solid #e8e7f5; padding: 1rem 1rem 0.9rem; margin-bottom: 0.85rem; max-width: 680px; margin-left: auto; margin-right: auto; transition: border-color 0.2s; }
  .q-card.answered-correct { border-color: #639922; }
  .q-card.answered-wrong { border-color: #d94f4f; }
  .q-card.unanswered-end { border-color: #f0a500; }

  .q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .q-num { font-size: 11px; font-weight: 700; color: #534AB7; background: #eeedfe; padding: 2px 9px; border-radius: 99px; }
  .q-mark { font-size: 11px; color: #888; }
  .q-text { font-size: 14.5px; font-weight: 500; color: #1a1a1a; line-height: 1.55; margin-bottom: 0.7rem; }
  .q-img { width: 100%; max-height: 170px; object-fit: contain; border-radius: 10px; border: 1px solid #eee; margin-bottom: 0.7rem; background: #f9f9f9; }

  .options { display: flex; flex-direction: column; gap: 7px; }
  .opt-btn { text-align: left; padding: 9px 13px; font-size: 13.5px; border-radius: 9px; border: 1px solid #e0e0e0; background: #fafafa; color: #1a1a1a; cursor: pointer; transition: background 0.12s, border-color 0.12s; line-height: 1.4; width: 100%; display: flex; align-items: center; gap: 9px; }
  .opt-btn:hover:not(:disabled) { background: #f0eff8; border-color: #534AB7; }
  .opt-circle { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; border: 1.5px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #888; background: #fff; transition: all 0.12s; }
  .opt-btn:hover:not(:disabled) .opt-circle { border-color: #534AB7; color: #534AB7; }
  .opt-btn.selected .opt-circle { background: #534AB7; border-color: #534AB7; color: #fff; }
  .opt-btn.selected { background: #eeedfe; border-color: #534AB7; color: #534AB7; }
  .opt-btn.correct { background: #eaf3de; border-color: #639922; color: #27500a; }
  .opt-btn.correct .opt-circle { background: #639922; border-color: #639922; color: #fff; }
  .opt-btn.wrong { background: #fcebeb; border-color: #d94f4f; color: #501313; }
  .opt-btn.wrong .opt-circle { background: #d94f4f; border-color: #d94f4f; color: #fff; }
  .opt-btn.reveal-correct { background: #eaf3de; border-color: #639922; color: #27500a; }
  .opt-btn.reveal-correct .opt-circle { background: #639922; border-color: #639922; color: #fff; }
  .opt-btn:disabled { cursor: default; }

  .feedback-box { margin-top: 0.65rem; font-size: 13px; padding: 8px 11px; border-radius: 9px; line-height: 1.5; display: none; }
  .feedback-box.correct { background: #eaf3de; color: #27500a; border: 1px solid #b6d988; display: block; }
  .feedback-box.wrong { background: #fcebeb; color: #501313; border: 1px solid #f0b0b0; display: block; }

  .submit-wrap { max-width: 680px; margin: 1.5rem auto 0.5rem; }
  .submit-btn { width: 100%; padding: 14px; font-size: 16px; font-weight: 700; border-radius: 12px; border: none; background: linear-gradient(135deg, #534AB7, #7B72D9); color: #fff; cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s; }
  .submit-btn:hover { opacity: 0.9; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }

  /* Results */
  #result-screen { display: none; max-width: 680px; margin: 0 auto; }
  .result-hero { background: linear-gradient(135deg, #534AB7, #7B72D9); border-radius: 16px; padding: 1.5rem 1.25rem; text-align: center; margin-bottom: 1rem; }
  .result-hero h2 { font-size: 20px; color: #fff; font-weight: 700; margin-bottom: 4px; }
  .result-hero p { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 1rem; }
  .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .score-num { font-size: 32px; font-weight: 700; color: #fff; line-height: 1; }
  .score-label { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 1rem; }
  .stat-box { background: #fff; border-radius: 12px; padding: 0.85rem; text-align: center; border: 1.5px solid #e8e7f5; }
  .stat-val { font-size: 24px; font-weight: 700; }
  .stat-lbl { font-size: 12px; color: #888; margin-top: 3px; }
  .section-head { font-size: 12px; font-weight: 700; color: #534AB7; margin: 1.25rem 0 0.6rem; text-transform: uppercase; letter-spacing: 0.07em; padding-left: 2px; }
  .review-card { background: #fff; border: 1.5px solid #e8e7f5; border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.7rem; }
  .review-card.rc-correct { border-left: 4px solid #639922; }
  .review-card.rc-wrong { border-left: 4px solid #d94f4f; }
  .review-card.rc-skip { border-left: 4px solid #f0a500; }
  .review-q { font-size: 13px; font-weight: 500; color: #1a1a1a; margin-bottom: 6px; line-height: 1.45; }
  .review-tags { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; margin-bottom: 5px; }
  .tag { padding: 2px 9px; border-radius: 99px; }
  .tag.ans { background: #eeedfe; color: #3c3489; }
  .tag.correct { background: #eaf3de; color: #27500a; }
  .tag.wrong { background: #fcebeb; color: #501313; }
  .tag.skip { background: #fff3cd; color: #856404; }
  .review-explain { font-size: 12px; color: #555; line-height: 1.5; margin-top: 4px; }
  .restart-btn { width: 100%; padding: 13px; font-size: 15px; font-weight: 700; border-radius: 12px; border: none; background: linear-gradient(135deg, #534AB7, #7B72D9); color: #fff; cursor: pointer; margin-top: 0.5rem; }
  .restart-btn:hover { opacity: 0.9; }

  @media (min-width: 520px) {
    .stats-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<div id="quiz-section">
  <div class="header">
    <h1>CBSE Class 10 — Science MCQ</h1>
    <p>Life Processes &amp; Reflection of Light</p>
    <div class="header-stats">
      <span class="hstat">25 Questions</span>
      <span class="hstat">50 Marks</span>
      <span class="hstat">2 marks each</span>
    </div>
  </div>

  <div id="questions-container"></div>

  <div class="submit-wrap">
    <button class="submit-btn" id="submit-btn" onclick="submitQuiz()">Submit &amp; See Results</button>
  </div>
</div>

<div id="result-screen"></div>

<script>
const questions = [
  // ── Life Processes ──
  { chapter:"Life Processes", q:"Which of the following is the correct sequence of events in photosynthesis?", opts:["Light reactions → Calvin cycle → Glucose","Calvin cycle → Light reactions → Glucose","Glucose → Light reactions → Calvin cycle","Light reactions → Glucose → Calvin cycle"], ans:0, explain:"Light reactions happen first (in thylakoids), producing ATP and NADPH, then the Calvin cycle (stroma) fixes CO₂ into glucose." },
  { chapter:"Life Processes", q:"The breakdown of pyruvate to give carbon dioxide, water and energy takes place in:", opts:["Cytoplasm","Mitochondria","Chloroplast","Nucleus"], ans:1, explain:"Aerobic respiration (Krebs cycle + oxidative phosphorylation) occurs in the mitochondria, where pyruvate is fully oxidised." },
  { chapter:"Life Processes", q:"What is the role of HCl in the human stomach?", opts:["Digests proteins directly","Provides acidic medium for pepsin to act","Emulsifies fats","Neutralises food"], ans:1, explain:"HCl creates an acidic pH (~2) needed to activate pepsinogen into pepsin, which then digests proteins." },
  { chapter:"Life Processes", img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Diagram_of_the_human_heart_%28cropped%29.svg/400px-Diagram_of_the_human_heart_%28cropped%29.svg.png", q:"Refer to the heart diagram. Which chamber receives oxygenated blood from the lungs?", opts:["Right atrium","Right ventricle","Left atrium","Left ventricle"], ans:2, explain:"Pulmonary veins bring oxygenated blood from the lungs into the left atrium." },
  { chapter:"Life Processes", q:"Which of the following organisms carry out anaerobic respiration to produce ethanol?", opts:["Humans during exercise","Yeast","Lactobacillus","Both A and C"], ans:1, explain:"Yeast performs anaerobic fermentation: glucose → ethanol + CO₂. Lactobacillus produces lactic acid, not ethanol." },
  { chapter:"Life Processes", q:"The functional unit of the kidney responsible for filtration is:", opts:["Ureter","Nephron","Urethra","Bowman's capsule alone"], ans:1, explain:"The nephron is the structural and functional unit of the kidney. Bowman's capsule is merely a part of the nephron." },
  { chapter:"Life Processes", q:"Which of the following is NOT a raw material for photosynthesis?", opts:["Carbon dioxide","Water","Oxygen","Sunlight"], ans:2, explain:"Oxygen is a by-product of photosynthesis (released from splitting of water). Raw materials are CO₂, water, and light." },
  { chapter:"Life Processes", q:"Blood pressure is measured in:", opts:["Pascal","mm of Hg","Newton/m²","Atmosphere"], ans:1, explain:"Blood pressure is clinically measured in millimetres of mercury (mm Hg). Normal value is approximately 120/80 mm Hg." },
  { chapter:"Life Processes", q:"In which part of the alimentary canal is water absorbed maximally?", opts:["Stomach","Small intestine","Large intestine","Oesophagus"], ans:2, explain:"The large intestine (colon) is the primary site of water absorption, converting liquid chyme into solid faeces." },
  { chapter:"Life Processes", q:"Opening and closing of stomata is controlled by:", opts:["Epidermal cells","Guard cells","Mesophyll cells","Root hair cells"], ans:1, explain:"Guard cells surround the stomatal pore. Turgid guard cells open stomata; flaccid guard cells close them." },
  { chapter:"Life Processes", q:"Which vein carries oxygenated blood in the human body?", opts:["Pulmonary vein","Hepatic vein","Renal vein","Jugular vein"], ans:0, explain:"Pulmonary veins carry oxygenated blood from the lungs to the left atrium — the only veins carrying oxygenated blood." },
  { chapter:"Life Processes", q:"Gall bladder stores:", opts:["Insulin","Bile juice","Pancreatic juice","Gastric juice"], ans:1, explain:"The gall bladder stores and concentrates bile juice produced by the liver. Bile emulsifies fats in the small intestine." },
  { chapter:"Life Processes", q:"Which enzyme begins the digestion of starch in the mouth?", opts:["Pepsin","Lipase","Salivary amylase","Trypsin"], ans:2, explain:"Salivary amylase (ptyalin) secreted by salivary glands begins the digestion of starch into maltose in the mouth." },
  // ── Reflection of Light ──
  { chapter:"Reflection of Light", q:"The image formed by a plane mirror is:", opts:["Real and inverted","Virtual and erect","Real and erect","Virtual and inverted"], ans:1, explain:"A plane mirror forms a virtual, erect image of the same size as the object, which is laterally inverted." },
  { chapter:"Reflection of Light", q:"Which mirror is used as a rear-view mirror in vehicles?", opts:["Concave mirror","Plane mirror","Convex mirror","Parabolic mirror"], ans:2, explain:"Convex mirrors give a wider field of view and always form erect, diminished virtual images — ideal for rear-view mirrors." },
  { chapter:"Reflection of Light", img:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Concave_mirror.svg/400px-Concave_mirror.svg.png", q:"For a concave mirror, when the object is placed at the centre of curvature (C), the image is formed:", opts:["At infinity","At focus F","At C itself","Between F and C"], ans:2, explain:"When the object is at C, the image forms at C itself — real, inverted and of the same size as the object." },
  { chapter:"Reflection of Light", q:"The focal length of a concave mirror is 15 cm. Its radius of curvature is:", opts:["7.5 cm","15 cm","30 cm","45 cm"], ans:2, explain:"R = 2f = 2 × 15 = 30 cm. This is a fundamental relation for spherical mirrors." },
  { chapter:"Reflection of Light", q:"A ray of light passing through the principal focus of a concave mirror, after reflection will:", opts:["Pass through the centre of curvature","Become parallel to the principal axis","Pass through the pole","Retrace its path"], ans:1, explain:"By the laws of reflection: a ray through F reflects parallel to the principal axis (and vice versa)." },
  { chapter:"Reflection of Light", q:"The mirror formula is:", opts:["1/v + 1/u = 1/f","1/v − 1/u = 1/f","1/f = 1/v × 1/u","v + u = f"], ans:0, explain:"Mirror formula: 1/v + 1/u = 1/f, where u = object distance, v = image distance, f = focal length (all from pole)." },
  { chapter:"Reflection of Light", q:"Magnification m = −v/u. A magnification of −2 means the image is:", opts:["Virtual and erect, twice the size","Real and inverted, twice the size","Virtual and inverted, twice the size","Real and erect, twice the size"], ans:1, explain:"Negative magnification → real and inverted image. |m| = 2 → image is twice the size of the object." },
  { chapter:"Reflection of Light", q:"Which of the following is used as a shaving/makeup mirror?", opts:["Convex mirror","Plane mirror","Concave mirror","Both A and B"], ans:2, explain:"Concave mirrors form a magnified, erect, virtual image when the object is between F and P — ideal for shaving/makeup." },
  { chapter:"Reflection of Light", q:"An object is placed 20 cm in front of a concave mirror of focal length 10 cm. The image distance is:", opts:["10 cm","20 cm","−20 cm","−10 cm"], ans:2, explain:"1/v + 1/(−20) = 1/(−10) → 1/v = −1/10 + 1/20 = −1/20 → v = −20 cm. Real image, 20 cm in front of mirror." },
  { chapter:"Reflection of Light", q:"The angle of incidence is always measured from:", opts:["The mirror surface","The normal at the point of incidence","The principal axis","The pole"], ans:1, explain:"By convention, angles of incidence and reflection are always measured from the normal at the point of incidence." },
  { chapter:"Reflection of Light", q:"Which type of image can be obtained on a screen?", opts:["Virtual image","Erect image","Real image","Diminished image"], ans:2, explain:"Only real images can be projected on a screen because light rays actually converge at the image point." },
  { chapter:"Reflection of Light", q:"The image formed by a convex mirror is always:", opts:["Real, inverted, diminished","Virtual, erect, enlarged","Virtual, erect, diminished","Real, erect, same size"], ans:2, explain:"A convex mirror always forms a virtual, erect and diminished image regardless of object position." },
];

let userAnswers = Array(questions.length).fill(null);
let submitted = false;

// Build all question cards
function buildQuestions() {
  const container = document.getElementById('questions-container');
  let currentChapter = '';
  questions.forEach((q, i) => {
    if (q.chapter !== currentChapter) {
      currentChapter = q.chapter;
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = (q.chapter === 'Life Processes' ? '📗' : '🔦') + '  ' + q.chapter;
      container.appendChild(lbl);
    }
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-'+i;

    let imgHtml = '';
    if (q.img) imgHtml = `<img class="q-img" src="${q.img}" alt="diagram" />`;

    let optsHtml = '<div class="options" id="opts-'+i+'">';
    q.opts.forEach((o, j) => {
      optsHtml += `<button class="opt-btn" id="opt-${i}-${j}" onclick="selectOpt(${i},${j})">
        <span class="opt-circle">${String.fromCharCode(65+j)}</span>
        <span>${o}</span>
      </button>`;
    });
    optsHtml += '</div>';

    card.innerHTML = `
      <div class="q-top">
        <span class="q-num">Q ${i+1}</span>
        <span class="q-mark">2 marks</span>
      </div>
      <div class="q-text">${q.q}</div>
      ${imgHtml}
      ${optsHtml}
      <div class="feedback-box" id="fb-${i}"></div>
    `;
    container.appendChild(card);
  });
}

function selectOpt(qi, oi) {
  if (submitted) return;
  userAnswers[qi] = oi;
  // Clear all options for this question
  questions[qi].opts.forEach((_, j) => {
    const btn = document.getElementById(`opt-${qi}-${j}`);
    btn.classList.remove('selected');
  });
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;
  document.getElementById('submit-btn').disabled = true;

  let correct = 0, wrong = 0, skipped = 0;

  questions.forEach((q, i) => {
    const ua = userAnswers[i];
    const card = document.getElementById('qcard-'+i);
    const fb = document.getElementById('fb-'+i);

    // Disable all buttons
    q.opts.forEach((_, j) => {
      const btn = document.getElementById(`opt-${i}-${j}`);
      btn.disabled = true;
      btn.classList.remove('selected');
      if (j === q.ans) btn.classList.add('reveal-correct');
    });

    if (ua === null) {
      skipped++;
      card.classList.add('unanswered-end');
      fb.className = 'feedback-box wrong';
      fb.innerHTML = `<b>⚠ Skipped.</b> Correct answer: <b>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</b>. ${q.explain}`;
    } else if (ua === q.ans) {
      correct++;
      card.classList.add('answered-correct');
      document.getElementById(`opt-${i}-${ua}`).classList.remove('reveal-correct');
      document.getElementById(`opt-${i}-${ua}`).classList.add('correct');
      fb.className = 'feedback-box correct';
      fb.innerHTML = `<b>✓ Correct!</b> ${q.explain}`;
    } else {
      wrong++;
      card.classList.add('answered-wrong');
      document.getElementById(`opt-${i}-${ua}`).classList.add('wrong');
      fb.className = 'feedback-box wrong';
      fb.innerHTML = `<b>✗ Incorrect.</b> Correct answer: <b>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</b>. ${q.explain}`;
    }
  });

  // Show result banner at top and scroll to it
  showResultBanner(correct, wrong, skipped);
}

function showResultBanner(correct, wrong, skipped) {
  const marks = correct * 2;
  const pct = Math.round(correct / questions.length * 100);
  let grade = pct >= 90 ? '🌟 Excellent!' : pct >= 70 ? '👍 Good Job!' : pct >= 50 ? '📚 Keep Practicing!' : '💪 Needs More Practice';

  const banner = document.createElement('div');
  banner.id = 'result-banner';
  banner.style.cssText = 'max-width:680px;margin:0 auto 1.25rem;background:linear-gradient(135deg,#534AB7,#7B72D9);border-radius:16px;padding:1.5rem 1.25rem;text-align:center;';
  banner.innerHTML = `
    <div style="font-size:19px;font-weight:700;color:#fff;margin-bottom:4px;">Quiz Submitted! ${grade}</div>
    <div style="font-size:13px;color:rgba(255,255,255,0.8);margin-bottom:1rem;">CBSE Class 10 — Life Processes &amp; Reflection of Light</div>
    <div style="width:120px;height:120px;border-radius:50%;border:5px solid rgba(255,255,255,0.5);background:rgba(255,255,255,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1rem;">
      <span style="font-size:30px;font-weight:700;color:#fff;line-height:1">${pct}%</span>
      <span style="font-size:12px;color:rgba(255,255,255,0.75)">score</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem;">
      <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:10px;"><div style="font-size:24px;font-weight:700;color:#fff">${marks}<span style="font-size:14px;opacity:0.7">/50</span></div><div style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px">Marks</div></div>
      <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:10px;"><div style="font-size:24px;font-weight:700;color:#fff">${correct}</div><div style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px">Correct</div></div>
      <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:10px;"><div style="font-size:24px;font-weight:700;color:#fff">${wrong}</div><div style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px">Incorrect</div></div>
      <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:10px;"><div style="font-size:24px;font-weight:700;color:#fff">${skipped}</div><div style="font-size:12px;color:rgba(255,255,255,0.75);margin-top:2px">Skipped</div></div>
    </div>
    <button onclick="restartQuiz()" style="padding:11px 28px;font-size:14px;font-weight:700;border-radius:10px;border:2px solid rgba(255,255,255,0.7);background:transparent;color:#fff;cursor:pointer;">↺ Restart Quiz</button>
  `;

  const quizSection = document.getElementById('quiz-section');
  quizSection.insertBefore(banner, quizSection.firstChild);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function restartQuiz() {
  userAnswers = Array(questions.length).fill(null);
  submitted = false;
  // Remove result banner
  const banner = document.getElementById('result-banner');
  if (banner) banner.remove();
  // Re-enable submit
  document.getElementById('submit-btn').disabled = false;
  // Reset all cards
  questions.forEach((q, i) => {
    const card = document.getElementById('qcard-'+i);
    card.classList.remove('answered-correct','answered-wrong','unanswered-end');
    const fb = document.getElementById('fb-'+i);
    fb.className = 'feedback-box';
    fb.innerHTML = '';
    q.opts.forEach((_, j) => {
      const btn = document.getElementById(`opt-${i}-${j}`);
      btn.disabled = false;
      btn.className = 'opt-btn';
    });
  });
  window.scrollTo({top: 0, behavior: 'smooth'});
}

buildQuestions();
</script>
</body>
</html>
