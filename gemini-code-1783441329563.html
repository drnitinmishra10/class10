<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 Chemistry - Interactive Quiz</title>
    <style>
        :root {
            --primary-color: #4a00e0;
            --secondary-color: #8e2de2;
            --correct-bg: #e8f5e9;
            --correct-text: #1b5e20;
            --correct-border: #a5d6a7;
            --wrong-bg: #ffebee;
            --wrong-text: #b71c1c;
            --wrong-border: #ef9a9a;
            --warn-bg: #fffde7;
            --warn-text: #f57f17;
            --warn-border: #fff59d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.5rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .instructions {
            background: linear-gradient(to right, #eef2f3, #e4e8f0);
            border-left: 5px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 35px;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .question-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #1a202c;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }

        .option-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            background: #f8fafc;
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            user-select: none;
            min-width: 100px;
            justify-content: center;
        }

        .option-label:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
            accent-color: var(--primary-color);
        }

        /* Dynamic Feedback Styles */
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct-feedback {
            background-color: var(--correct-bg);
            color: var(--correct-text);
            border: 1px solid var(--correct-border);
        }

        .wrong-feedback {
            background-color: var(--wrong-bg);
            color: var(--wrong-text);
            border: 1px solid var(--wrong-border);
        }

        .warn-feedback {
            background-color: var(--warn-bg);
            color: var(--warn-text);
            border: 1px solid var(--warn-border);
        }

        .btn-container {
            text-align: center;
            margin-top: 40px;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(142, 45, 226, 0.4);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(142, 45, 226, 0.6);
        }

        #result-card {
            display: none;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Chemical Reactions & Equations</h1>
    <div class="subtitle">Class 10 CBSE Chemistry — Chapter 1 Practice Drill</div>
    
    <div class="instructions">
        🎯 <strong>Self-Assessment Mode:</strong> Go through the 25 statements below. You can submit the quiz at any time, even if you leave some questions unanswered! Skips will be flagged separately.
    </div>

    <form id="quizForm">
        <div id="questionsContainer"></div>

        <div class="btn-container">
            <button type="button" class="submit-btn" onclick="checkQuiz()">Check My Answers</button>
        </div>
    </form>

    <div id="result-card"></div>
</div>

<script>
    const quizData = [
        { q: "Burning of magnesium ribbon in air is a physical change.", a: "false", e: "It is a chemical change because a new substance, Magnesium Oxide (MgO), is formed with the emission of heat and light." },
        { q: "A chemical equation is balanced to satisfy the Law of Conservation of Mass.", a: "true", e: "According to this law, mass can neither be created nor destroyed in a chemical reaction, so the number of atoms on both sides must be equal." },
        { q: "The reaction between iron and copper sulfate solution is an example of a double displacement reaction.", a: "false", e: "It is a single displacement reaction where highly reactive Iron displaces less reactive Copper from its salt solution." },
        { q: "Calcium oxide reacts vigorously with water to produce slaked lime.", a: "true", e: "CaO + H₂O → Ca(OH)₂. This reaction is highly exothermic and forms Calcium Hydroxide (slaked lime)." },
        { q: "The decomposition of vegetable matter into compost is an endothermic reaction.", a: "false", e: "It is an exothermic reaction because heat energy is released during the decomposition process by microbes." },
        { q: "When lead nitrate powder is heated, brown fumes of nitrogen dioxide emission are observed.", a: "true", e: "Heating lead nitrate produces Lead Oxide, Oxygen, and brown fumes of Nitrogen Dioxide (NO₂)." },
        { q: "The formula of rust is FeO.", a: "false", e: "The correct chemical formula for rust is hydrated ferric oxide, typically written as Fe₂O₃·xH₂O." },
        { q: "In a combination reaction, two or more reactants combine to form a single product.", a: "true", e: "By definition, combination reactions feature multiple starting materials fusing into one final compound." },
        { q: "Silver chloride turns grey in sunlight due to the formation of silver metal.", a: "true", e: "This is a photolytic decomposition reaction where AgCl splits into Silver metal (grey) and Chlorine gas." },
        { q: "All decomposition reactions are exothermic.", a: "false", e: "Most decomposition reactions require energy in the form of heat, light, or electricity to break bonds, making them endothermic." },
        { q: "Respiration is considered an exothermic reaction.", a: "true", e: "During respiration, glucose combines with oxygen in our body cells to release carbon dioxide, water, and energy." },
        { q: "When hydrogen gas is passed over heated copper oxide, the black coating turns brown.", a: "true", e: "CuO + H₂ → Cu + H₂O. Copper oxide is reduced to metallic copper, which has a distinct reddish-brown color." },
        { q: "Oxidation is the loss of oxygen or gain of hydrogen.", a: "false", e: "Oxidation is exactly the opposite: it is the gain of oxygen or the loss of hydrogen (or electrons)." },
        { q: "A reducing agent itself gets oxidized during a redox reaction.", a: "true", e: "A reducing agent reduces the other substance by losing electrons or giving hydrogen, thereby oxidizing itself." },
        { q: "Chips manufacturers flush bags of chips with oxygen gas to prevent rancidity.", a: "false", e: "They flush bags with Nitrogen gas because it is inert and prevents the oxidation of fats and oils." },
        { q: "The insoluble substance formed during a chemical reaction is called a precipitate.", a: "true", e: "A precipitate is a solid that separates out from a liquid solution during a chemical transformation." },
        { q: "The symbol (aq) represents a substance dissolved in alcohol.", a: "false", e: "(aq) stands for aqueous, meaning the substance is dissolved specifically in water." },
        { q: "Electrolysis of water is a thermal decomposition reaction.", a: "false", e: "It is an electrolytic decomposition reaction, as it utilizes electrical energy rather than thermal energy (heat)." },
        { q: "During the electrolysis of water, the volume of gas collected at the cathode is double the volume collected at the anode.", a: "true", e: "Water (H₂O) contains two parts hydrogen to one part oxygen. Hydrogen is liberated at the cathode, so its volume is double." },
        { q: "Corrosion of copper produces a black-colored coating on its surface.", a: "false", e: "Corrosion of copper produces a green coating of basic copper carbonate. Silver develops a black coating." },
        { q: "The reaction between an acid and a base is a neutralization reaction and also a double displacement reaction.", a: "true", e: "There is an exchange of ions between the acid and base to form salt and water, fitting both definitions." },
        { q: "Barium sulfate is soluble in water.", a: "false", e: "Barium sulfate (BaSO₄) forms a white, insoluble precipitate when barium chloride reacts with sodium sulfate." },
        { q: "A balanced chemical equation tells us about the physical state of reactants and products only if specified by symbols like (s), (l), (g), and (aq).", a: "true", e: "State symbols must be explicitly written alongside the formulas to provide information about physical states." },
        { q: "Fatty foods change their smell and taste when oxidized; this phenomenon is called corrosion.", a: "false", e: "This phenomenon is called rancidity. Corrosion applies to the degradation of metals by environmental interaction." },
        { q: "When zinc pieces are added to dilute hydrochloric acid, hydrogen gas is evolved with a popping sound when tested with a burning splinter.", a: "true", e: "Zinc displays hydrogen from HCl to form Zinc Chloride and Hydrogen gas, which burns with a characteristic pop sound." }
    ];

    function loadQuestions() {
        const container = document.getElementById('questionsContainer');
        quizData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-text">Q${index + 1}. ${item.q}</div>
                <div class="options">
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="true"> True
                    </label>
                    <label class="option-label">
                        <input type="radio" name="q${index}" value="false"> False
                    </label>
                </div>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            container.appendChild(card);
        });
    }

    function checkQuiz() {
        let correctCount = 0;
        let attemptedCount = 0;

        quizData.forEach((item, index) => {
            const selectedRadio = document.querySelector(`input[name="q${index}"]:checked`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            feedbackDiv.style.display = 'block';
            
            if (!selectedRadio) {
                // If skipped
                feedbackDiv.className = 'feedback warn-feedback';
                feedbackDiv.innerHTML = `⚠️ <b>Not Attempted.</b> The correct answer is <b>${item.a.toUpperCase()}</b>.<br>${item.e}`;
            } else {
                attemptedCount++;
                const selectedValue = selectedRadio.value;
                
                if (selectedValue === item.a) {
                    correctCount++;
                    feedbackDiv.className = 'feedback correct-feedback';
                    feedbackDiv.innerHTML = `🎉 <strong>Correct!</strong> ${item.e}`;
                } else {
                    feedbackDiv.className = 'feedback wrong-feedback';
                    feedbackDiv.innerHTML = `❌ <strong>Incorrect.</strong> The correct answer is <b>${item.a.toUpperCase()}</b>.<br>${item.e}`;
                }
            }
        });

        // Show total score card
        const resultCard = document.getElementById('result-card');
        resultCard.style.display = 'block';
        
        let percentage = attemptedCount > 0 ? Math.round((correctCount / quizData.length) * 100) : 0;
        
        resultCard.innerHTML = `
            Score: ${correctCount} / ${quizData.length} Correct (${percentage}%) <br>
            <span style="font-size: 1rem; font-weight: normal; opacity: 0.9;">
                You attempted ${attemptedCount} out of ${quizData.length} questions.
            </span>
        `;
        
        // Dynamic summary card color styling
        if (correctCount >= 20) {
            resultCard.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
            resultCard.style.color = '#fff';
        } else if (correctCount >= 12) {
            resultCard.style.background = 'linear-gradient(135deg, #f12711 0%, #f5af19 100%)';
            resultCard.style.color = '#fff';
        } else {
            resultCard.style.background = 'linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)';
            resultCard.style.color = '#fff';
        }

        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    window.onload = loadQuestions;
</script>

</body>
</html>
